name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-linux:
    name: Core-Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Tests (UI-freie Logik)
        run: dotnet run --project tests/DevVmCleanup.Tests -c Release

  windows-build:
    name: WPF-Build + Pester (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build DevVmCleanup.slnx -c Release
      - name: Tests (C#)
        run: dotnet run --project tests/DevVmCleanup.Tests -c Release --no-build
      - name: Pester (Module)
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Invoke-Pester tests/Pester -CI -Output Detailed
      - name: Installer-Test (Inno Setup, ohne Release)
        shell: pwsh
        run: |
          dotnet publish src/DevVmCleanup.App/DevVmCleanup.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish/app
          if ($LASTEXITCODE -ne 0) { throw "Publish fehlgeschlagen" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=0.0.0" installer\DevVM-Cleanup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup fehlgeschlagen" }
          if (-not (Test-Path "artifacts/DevVM-Cleanup_0.0.0_Setup.exe")) { throw "Setup.exe nicht erzeugt" }
          # Ordner modules und Help müssen mitgeliefert werden
          foreach ($d in 'modules', 'Help') { if (-not (Test-Path "publish/app/$d")) { throw "$d fehlt im Publish-Ordner" } }
